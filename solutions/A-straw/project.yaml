pitch: >-
  An open, unpowered personal filter straw: a rinseable steel mesh, a bought hollow-fibre membrane and a small carbon bed in a 205 mm by 26 mm body, with a capped backflush socket that cleans the fibres without passing the carbon. Designed to reduce bacteria and protozoa in clear freshwater; it does not remove viruses.
problem: >-
  People who drink from streams, lakes, stored or distrusted water need a personal barrier against bacteria and protozoa that works at a child's suction, can be cleaned in the field and never fails silently, at a humanitarian cost per litre.
