pitch: >-
  A tool-free dose cap for the 28 mm bottle neck (and a proposed port on the household bucket) that holds one NaDCC
  tablet matched to the container in a keyed well and shows the 30 minute wait with a flip-over ball timer, so water is
  chlorinated at the household rate to address viruses and bacteria before it goes through the Helpful Water filters,
  which remain the barrier for Cryptosporidium.
problem: >-
  The Helpful Water filters do not remove viruses; chlorine tablets do, but in practice the dose is wrong for the
  container, the wait is cut short or not lengthened for cold water, and the order of chlorinating then filtering is lost.
