pitch: >-
  A two-bucket household gravity filter on a timber stand, designed to reduce bacteria and protozoa in a day's drinking and cooking water for five people (45 L) in a few hours: cloth prefilter and settling in the raw bucket, a bought 0.1 um hollow-fibre module, and a closed clean bucket with a tap; not a virus barrier, so the raw water is dosed with chlorine (solution D) first where viruses are a risk.
problem: >-
  A straw protects only the person sipping; households need treated water for cooking, stored supplies and infants, kept closed against recontamination, from local containers, without power, and usable with muddy river water after settling.
