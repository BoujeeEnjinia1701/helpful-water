pitch: >-
  A screw-on cartridge that turns a standard 28 mm PET bottle into a squeeze filter designed to reduce bacteria and protozoa: mesh, a replaceable carbon capsule and a bought hollow-fibre module, backflushed with a syringe; not a virus barrier, so it is paired with chlorine where viruses are a risk.
problem: >-
  Families, schools and camps need a low-cost personal filter that works with the bottles they already have, lasts 6 to 12 months and has a consumable they can resupply, without power, tools or a straw that serves only the person sipping.
